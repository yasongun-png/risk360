<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İSG Platform">
<link rel="icon" href="assets/icons/favicon-32.png">
<title>İSG Platform - Giriş</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="giris-sahne">
    <div class="giris-kutu">
      <h1>🛡️ İSG Yönetim Platformu</h1>
      <div class="alt-baslik">Devam etmek için giriş yapın</div>

      <div class="hata-mesaji" id="hataMesaji"></div>

      <form id="girisForm">
        <label for="kullaniciAdi">Kullanıcı Adı</label>
        <input type="text" id="kullaniciAdi" autocomplete="username" required>

        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" autocomplete="current-password" required>

        <button type="submit" class="birincil">Giriş Yap</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="core/data.js"></script>
  <script src="core/auth.js"></script>
  <script>
    // Zaten oturumu açık kullanıcıyı doğrudan akışın devamına gönder.
    if (oturumdakiKullanici()) {
      window.location.href = 'firma-sec.html';
    }

    document.getElementById('girisForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const kullaniciAdi = document.getElementById('kullaniciAdi').value;
      const sifre = document.getElementById('sifre').value;
      const hataMesaji = document.getElementById('hataMesaji');
      const girisBtn = document.querySelector('#girisForm button[type=submit]');

      // girisYap() artık 'isg_oturum_gecmisi' (giriş/çıkış geçmişi) okuyup
      // yazıyor — bu yeni bir belge olduğundan, bu cihaz buluttan
      // DOĞRULANMIŞ (fromCache=false) ilk senkronu almadan okuyup yazarsa,
      // başka bir cihazın o an eklemiş olabileceği geçmişin üzerine
      // yazabilir (bkz. core/data.js _bulutBaslat fromCache koruması —
      // aynı riskin bir örneği, orada yaşanan veri kaybından ders alındı).
      // Bu yüzden giriş, bulut senkronu doğrulanana kadar bekletilir.
      girisBtn.disabled = true;
      let devamEtti = false;
      const devamEt = async () => {
        if (devamEtti) return;
        devamEtti = true;
        const sonuc = await girisYap(kullaniciAdi, sifre);
        girisBtn.disabled = false;
        if (!sonuc.basarili) {
          hataMesaji.textContent = sonuc.hata;
          hataMesaji.classList.add('gorunur');
          return;
        }
        window.location.href = 'firma-sec.html';
      };
      // Bağlantı çok yavaşsa/koptuysa kullanıcı sonsuza dek beklemesin —
      // makul bir süre sonra yine de devam edilir (bkz. yukarıdaki not).
      setTimeout(devamEt, 8000);
      bulutHazirOlduğunda(devamEt);
    });
  </script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }</script>
</body>
</html>
