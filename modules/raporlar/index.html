<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İSG Platform">
<link rel="icon" href="../../assets/icons/favicon-32.png">
<title>İSG Platform - Raporlar</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <div class="ust-cubuk">
    <div class="marka">🛡️ İSG Yönetim Platformu</div>
    <div class="kullanici-bilgi">
      <span id="kullaniciEtiketi"></span>
      <a class="cikis-linki" id="cikisLinki">Çıkış Yap</a>
    </div>
  </div>

  <div class="icerik">
    <a href="../../dashboard.html" class="geri-link">← Kontrol Paneline Dön</a>
    <div class="arac-cubugu" style="margin-top:14px;">
      <div>
        <h2 style="margin:0;">Raporlar</h2>
        <p style="color:#6b7280; font-size:13px; margin:2px 0 0;" id="firmaEtiketi"></p>
      </div>
      <button type="button" class="ikincil" id="rpYazdirBtn">Özet Raporu Yazdır</button>
    </div>
    <p style="color:var(--metin-soluk); font-size:12px; margin-top:-8px;">Tüm modüllerden derlenen İSG performans özeti — salt okunur. Kayıt düzenlemek için ilgili modüle gidin.</p>

    <div id="rpIcerik"></div>
  </div>

  <div id="yazdirmaAlani"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../core/data.js"></script>
  <script src="../../core/auth.js"></script>
  <script src="../../core/tenant.js"></script>
  <script src="../../core/rapor.js"></script>
  <script src="../merkezi-aksiyon/service.js"></script>
  <script src="service.js"></script>
  <script src="ui.js"></script>
  <script>
    const kullanici = girisGerekliModul('raporlar');

    if (kullanici) {
      document.getElementById('kullaniciEtiketi').textContent = '👤 ' + kullanici.adSoyad;
      document.getElementById('cikisLinki').addEventListener('click', () => {
        cikisYap();
        window.location.href = '../../index.html';
      });

      const aktifFirma = aktifFirmaGetir();
      if (!aktifFirma) {
        window.location.href = '../../firma-sec.html';
      } else {
        bulutFirmaHazirOlduğunda(aktifFirma.slug, () => {
          document.getElementById('firmaEtiketi').textContent = aktifFirma.ad + ' — tüm modüllerden derlenen İSG performans özeti';
          raporlarSayfasiniBaslat(aktifFirma);
        });
      }
    }
  </script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('../../sw.js'); }</script>
</body>
</html>
