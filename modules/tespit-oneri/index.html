<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İSG Platform">
<link rel="icon" href="../../assets/icons/favicon-32.png">
<title>İSG Platform - Tespit ve Öneri Defteri</title>
<link rel="stylesheet" href="../../assets/style.css?v=1">
<style>
  /* Dijital imza pad'i -- modules/uygunsuzluk/index.html'deki .uc-imza-*
     ile aynı desen (bkz. ui.js _toImzaPaduBagla). */
  .uc-imza-canvas { width: 100%; height: 120px; border: 1.5px dashed var(--kenarlik, #9ca3af); border-radius: 10px; touch-action: none; background: #fff; display: block; }
  .uc-imza-arac { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .uc-imza-temizle { border: none; background: none; color: var(--hata, #dc2626); font-size: 11.5px; font-weight: 700; cursor: pointer; padding: 4px; }
  .uc-imza-ipucu { font-size: 11px; color: var(--metin-soluk, #6b7280); }
  .uc-imza-rol-satir { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--kenarlik, #e5e7eb); }
  .uc-imza-rol-satir:last-child { border-bottom: none; }
</style>
</head>
<body>
  <div class="ust-cubuk">
    <div class="marka">🛡️ İSG Yönetim Platformu</div>
    <div class="kullanici-bilgi">
      <span id="kullaniciEtiketi"></span>
      <a class="cikis-linki" id="cikisLinki">Çıkış Yap</a>
    </div>
  </div>

  <div class="icerik">
    <a href="../../dashboard.html" class="geri-link">← Kontrol Paneline Dön</a>
    <h2 style="margin-top:14px;">Tespit ve Öneri Defteri</h2>
    <p style="color:#6b7280; font-size:13px; margin-top:-8px;" id="firmaEtiketi"></p>

    <!-- Kullanıcı isteği: "tespit öneri ana sayfa üstünde hamgi sicile kaç
         adet tespit öneri yapıldı gibi istatistikler olsun" -- sekmeden
         bağımsız, sayfanın en üstünde her zaman görünür. -->
    <div id="sicilIstatistikKutusu" class="kart" style="margin-bottom:14px; padding:12px 14px; display:none;"></div>

    <div class="sekme-cubugu">
      <button type="button" id="sekmeKayitlar">Kayıtlar</button>
      <button type="button" id="sekmeOzet" class="sekme-seciliDegil">Özet</button>
    </div>

    <div id="bolum-kayitlar">
      <div class="arac-cubugu">
        <input type="text" id="aramaKutusu" class="arama-kutusu" placeholder="No, bölüm, tespit, öneri veya tespit edene göre ara...">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <select id="durumFiltre" style="width:auto; margin:0;">
            <option value="">Tüm Durumlar</option>
          </select>
          <select id="oncelikFiltre" style="width:auto; margin:0;">
            <option value="">Tüm Öncelikler</option>
          </select>
          <select id="sicilFiltre" style="width:auto; margin:0;">
            <option value="">Tüm İşyeri Sicilleri</option>
          </select>
          <select id="uzmanFiltre" style="width:auto; margin:0;">
            <option value="">Tüm İş Güvenliği Uzmanları</option>
          </select>
          <button type="button" class="ikincil" id="sablonIndirBtn">Şablon İndir</button>
          <button type="button" class="ikincil" id="iceAktarBtn">İçe Aktar</button>
          <input type="file" id="iceAktarDosya" accept=".xlsx,.xls" style="display:none;">
          <button type="button" class="ikincil" id="disaAktarBtn">Dışa Aktar</button>
          <button type="button" class="ikincil" id="listeYazdirBtn">Listeyi Yazdır</button>
          <button type="button" class="ikincil" id="formAyarlariBtn">Form Ayarları</button>
          <!-- Kullanıcı isteği: "tespit önerileri yönetici kullanıc toplu
               da silebilsin" -- yalnızca silme yetkisi olan kullanıcılar
               için service.js tespitOneriToplusil izin kontrolü yapar. -->
          <button type="button" class="ikincil sil" id="topluSilBtn">Seçilenleri Sil</button>
          <button type="button" class="birincil" id="yeniKayitBtn" style="width:auto;">+ Yeni Kayıt</button>
        </div>
      </div>
      <div class="tablo-scroll">
        <table class="veri-tablosu">
          <thead>
            <!-- Kullanıcı isteği: "tespit öneri modülü tabloda tespit
                 sütununu iki katına çıkar genişlet yani" — diğer sütunlar
                 otomatik genişlikte kaldığından, Tespit sütununa açık bir
                 genişlik verilerek (auto-layout tabloda diğerlerinin
                 yaklaşık iki katı kadar) genişletildi. -->
            <tr><th style="width:36px;"><input type="checkbox" id="tumunuSecCheckbox"></th><th>İşlemler</th><th>No / Tarih</th><th>Bölüm / Tespit Eden</th><th style="width:22%;">Tespit</th><th>Öneri</th><th>Öncelik</th><th>Tebliğ</th><th>Fotoğraf</th><th>Durum</th></tr>
          </thead>
          <tbody id="tabloGovde"></tbody>
        </table>
      </div>
      <div class="bos-durum" id="bosDurum"></div>
    </div>

    <div id="bolum-ozet" style="display:none;">
      <div id="ozetKutusu"></div>
    </div>
  </div>

  <div id="yazdirmaAlani"></div>

  <div class="modal-katman" id="modalKatman">
    <div class="modal-kutu" style="max-width:640px;">
      <h3 id="modalBaslik">Yeni Tespit Kaydı</h3>
      <form id="kayitForm">

        <div class="form-satir-ikili">
          <div>
            <label for="tespitTarihi">Tespit Tarihi</label>
            <input type="date" id="tespitTarihi">
            <div class="alan-hatasi" id="tespitTarihiHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
          <div>
            <label for="oncelik">Öncelik</label>
            <select id="oncelik"></select>
          </div>
        </div>

        <label for="tespitEden">Tespiti Yapan</label>
        <input type="text" id="tespitEden" placeholder="Ad Soyad">
        <div class="alan-hatasi" id="tespitEdenHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <label for="isyeriSicili">İşyeri Sicili <span style="color:var(--metin-soluk); font-weight:400;">(opsiyonel)</span></label>
        <input type="text" id="isyeriSicili" placeholder="ör. 1234567.89.012.3456789">

        <label for="bolum">Bölüm / Yer</label>
        <input type="text" id="bolum" placeholder="Üretim Sahası">
        <div class="alan-hatasi" id="bolumHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <label for="tespit">Tespit (Bulgu)</label>
        <textarea id="tespit" placeholder="Gözlemlenen tehlike / uygunsuzluk"></textarea>
        <div class="alan-hatasi" id="tespitHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <label for="oneri">Öneri</label>
        <textarea id="oneri" placeholder="Önerilen düzeltici / önleyici tedbir"></textarea>
        <div class="alan-hatasi" id="oneriHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <label for="defterFotografiDosya">Defter Sayfası Fotoğrafı</label>
        <input type="file" id="defterFotografiDosya" accept="image/*" capture="environment">
        <div id="defterFotografiOnizleme" style="margin-top:6px; margin-bottom:14px;"></div>

        <div class="form-bolum-baslik">Tebliğ ve Uygulama</div>
        <div class="form-satir-ikili">
          <div>
            <label for="tebligEdilen">Tebliğ Edilen Birim/Kişi</label>
            <input type="text" id="tebligEdilen">
          </div>
          <div>
            <label for="tebligTarihi">Tebliğ Tarihi</label>
            <input type="date" id="tebligTarihi">
            <div class="alan-hatasi" id="tebligTarihiHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
        </div>
        <label for="yapilanIslem">Yapılan İşlem</label>
        <textarea id="yapilanIslem"></textarea>
        <div class="form-satir-ikili">
          <div>
            <label for="kapanisTarihi">Kapanış Tarihi</label>
            <input type="date" id="kapanisTarihi">
          </div>
          <div>
            <label for="durum">Durum (elle geçersiz kılmak isterseniz)</label>
            <select id="durum"></select>
          </div>
        </div>
        <label for="notlar">Not</label>
        <textarea id="notlar"></textarea>

        <div class="modal-eylemler">
          <button type="button" class="ikincil" id="modalIptalBtn">İptal</button>
          <button type="submit" class="birincil">Kaydet</button>
        </div>
      </form>
      <button type="button" class="tablo-buton" id="modalKapatBtn" style="position:absolute; top:20px; right:24px;">✕</button>
    </div>
  </div>

  <!-- İMZA MODAL — Tespit ve Öneri Formu'ndaki Onay bölümünün (Kaşe/İmza)
       dijital imzalanması. modules/uygunsuzluk/index.html imzaKatmani ile
       birebir aynı desen (bkz. ui.js _toImzaPaduBagla). -->
  <div class="modal-katman" id="imzaKatmani">
    <div class="modal-kutu" style="max-width:440px;">
      <h3>Kaşe / İmza</h3>
      <p style="font-size:12px; color:var(--metin-soluk); margin-top:-8px;" id="imzaKayitEtiketi"></p>

      <div id="imzaDurumGosterimi"></div>

      <div id="imzaCizimAlani" style="display:none;">
        <label for="imzaAdSoyad">Ad Soyad</label>
        <input type="text" id="imzaAdSoyad">
        <canvas id="imzaCanvas" class="uc-imza-canvas"></canvas>
        <div class="uc-imza-arac">
          <span class="uc-imza-ipucu">Fare/parmakla imzalayın</span>
          <button type="button" class="uc-imza-temizle" id="imzaTemizleBtn">Temizle</button>
        </div>
        <div class="alan-hatasi" id="imzaHata" style="color:var(--hata); font-size:12px; margin-top:8px;"></div>
        <div class="modal-eylemler">
          <button type="button" class="ikincil" id="imzaVazgecBtn">Vazgeç</button>
          <button type="button" class="birincil" id="imzaKaydetBtn">Kaydet</button>
        </div>
      </div>

      <div class="modal-eylemler" id="imzaKapatEylemi">
        <button type="button" class="ikincil" id="imzaKatmaniIptalBtn">Kapat</button>
      </div>
      <button type="button" class="tablo-buton" id="imzaKatmaniKapatBtn" style="position:absolute; top:20px; right:24px;">✕</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../../core/data.js"></script>
  <script src="../../core/auth.js"></script>
  <script src="../../core/tenant.js"></script>
  <script src="../../core/excel.js"></script>
  <script src="../../core/rapor.js"></script>
  <script src="../../core/form-ayarlari.js"></script>
  <script src="../../core/metin-istem.js"></script>
  <!-- "Uygunsuzluğa Aktar" köprüsü için (bkz. service.js
       tespitOneriUygunsuzlugaAktar) -- modules/acil-durum plan-detay.html'in
       kimyasal modülünü dahil etmesiyle aynı ilke. -->
  <script src="../uygunsuzluk/model.js"></script>
  <script src="../uygunsuzluk/validation.js"></script>
  <script src="../uygunsuzluk/repository.js"></script>
  <script src="../uygunsuzluk/service.js"></script>
  <script src="model.js"></script>
  <script src="validation.js"></script>
  <script src="repository.js"></script>
  <script src="service.js"></script>
  <script src="ui.js?v=1"></script>
  <script src="cikti.js?v=2"></script>
  <script>
    const kullanici = girisGerekliModul('tespit-oneri');

    if (kullanici) {
      document.getElementById('kullaniciEtiketi').textContent = '👤 ' + kullanici.adSoyad;
      document.getElementById('cikisLinki').addEventListener('click', () => {
        cikisYap();
        window.location.href = '../../index.html';
      });

      const aktifFirma = aktifFirmaGetir();
      if (!aktifFirma) {
        window.location.href = '../../firma-sec.html';
      } else {
        bulutFirmaHazirOlduğunda(aktifFirma.slug, () => {
          document.getElementById('firmaEtiketi').textContent = aktifFirma.ad + ' tespit ve öneri defteri kayıtları';
          document.getElementById('durumFiltre').innerHTML += TESPIT_DURUMLARI.map(d => `<option>${d}</option>`).join('');
          document.getElementById('oncelikFiltre').innerHTML += TESPIT_ONCELIKLERI.map(o => `<option>${o}</option>`).join('');
          tespitOneriSayfasiniBaslat();
        });
      }
    }
  </script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('../../sw.js'); }</script>
</body>
</html>
