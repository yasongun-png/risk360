<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İSG Platform">
<link rel="icon" href="../../assets/icons/favicon-32.png">
<title>İSG Platform - Periyodik Kontrol</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <div class="ust-cubuk">
    <div class="marka">🛡️ İSG Yönetim Platformu</div>
    <div class="kullanici-bilgi">
      <span id="kullaniciEtiketi"></span>
      <a class="cikis-linki" id="cikisLinki">Çıkış Yap</a>
    </div>
  </div>

  <div class="icerik">
    <a href="../../dashboard.html" class="geri-link">← Kontrol Paneline Dön</a>
    <h2 style="margin-top:14px;">Periyodik Kontrol</h2>
    <p style="color:#6b7280; font-size:13px; margin-top:-8px;" id="firmaEtiketi"></p>

    <div class="sekme-cubugu">
      <button type="button" data-sekme="ekipman">Ekipmanlar</button>
      <button type="button" data-sekme="kontrol" class="sekme-seciliDegil">Kontrol Kayıtları</button>
      <button type="button" data-sekme="ozet" class="sekme-seciliDegil">Özet</button>
    </div>

    <!-- EKİPMAN -->
    <div id="bolum-ekipman">
      <div class="arac-cubugu">
        <input type="text" id="ekipmanAramaKutusu" class="arama-kutusu" placeholder="Ekipman adı, no, demirbaş no veya bölüme göre ara...">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <select id="kategoriFiltre" style="width:auto; margin:0;"><option value="">Tüm Kategoriler</option></select>
          <select id="ekipmanDurumFiltre" style="width:auto; margin:0;">
            <option value="">Tüm Durumlar</option>
            <option>Aktif</option>
            <option>Yaklaşıyor</option>
            <option>Süresi Geçti</option>
            <option>Uygun Değil</option>
            <option>Pasif</option>
            <option>Bakımda</option>
            <option>Hurda</option>
          </select>
          <button type="button" class="ikincil" id="ekipmanSablonIndirBtn">Şablon İndir</button>
          <button type="button" class="ikincil" id="ekipmanIceAktarBtn">İçe Aktar</button>
          <input type="file" id="ekipmanIceAktarDosya" accept=".xlsx,.xls" style="display:none;">
          <button type="button" class="ikincil" id="formAyarlariBtn">Form Ayarları</button>
          <button type="button" class="ikincil" id="ekipmanDisaAktarBtn">Dışa Aktar</button>
          <button type="button" class="birincil" id="yeniEkipmanBtn" style="width:auto;">+ Yeni Ekipman</button>
        </div>
      </div>
      <div class="tablo-scroll">
        <table class="veri-tablosu">
          <thead><tr><th>Ekipman No</th><th>Ad</th><th>Kategori</th><th>Bölüm / Lokasyon</th><th>Periyot</th><th>Son Kontrol</th><th>Sonraki Kontrol</th><th>Durum</th><th>İşlemler</th></tr></thead>
          <tbody id="ekipmanTabloGovde"></tbody>
        </table>
      </div>
      <div class="bos-durum" id="ekipmanBosDurum"></div>
    </div>

    <!-- KONTROL KAYITLARI -->
    <div id="bolum-kontrol" style="display:none;">
      <div class="arac-cubugu">
        <input type="text" id="kontrolAramaKutusu" class="arama-kutusu" placeholder="Ekipman, rapor no veya firmaya göre ara...">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <select id="sonucFiltre" style="width:auto; margin:0;"><option value="">Tüm Sonuçlar</option></select>
          <button type="button" class="ikincil" id="kontrolDisaAktarBtn">Dışa Aktar</button>
          <button type="button" class="birincil" id="yeniKontrolBtn" style="width:auto;">+ Yeni Kontrol Kaydı</button>
        </div>
      </div>
      <div class="tablo-scroll">
        <table class="veri-tablosu">
          <thead><tr><th>Ekipman</th><th>Kontrol Tarihi</th><th>Tür</th><th>Rapor No</th><th>Firma</th><th>Uzman</th><th>Sonuç</th><th>İşlemler</th></tr></thead>
          <tbody id="kontrolTabloGovde"></tbody>
        </table>
      </div>
      <div class="bos-durum" id="kontrolBosDurum"></div>
    </div>

    <!-- ÖZET -->
    <div id="bolum-ozet" style="display:none;">
      <div id="periyodikOzetKutusu"></div>
    </div>
  </div>

  <div id="yazdirmaAlani"></div>

  <!-- EKİPMAN MODAL -->
  <div class="modal-katman" id="ekipmanModalKatman">
    <div class="modal-kutu" style="max-width:640px;">
      <h3 id="ekipmanModalBaslik">Yeni Ekipman</h3>
      <form id="ekipmanForm">
        <div class="form-satir-ikili">
          <div>
            <label for="ekAd">Ekipman Adı</label>
            <input type="text" id="ekAd">
            <div class="alan-hatasi" id="ekAdHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
          <div>
            <label for="ekDemirbasNo">Demirbaş No</label>
            <input type="text" id="ekDemirbasNo">
          </div>
        </div>

        <div class="form-satir-ikili">
          <div>
            <label for="ekKategori">Kategori</label>
            <select id="ekKategori"></select>
          </div>
          <div>
            <label for="ekRiskSeviyesi">Risk Seviyesi</label>
            <select id="ekRiskSeviyesi"></select>
          </div>
        </div>

        <div class="form-satir-ikili">
          <div>
            <label for="ekMarka">Marka</label>
            <input type="text" id="ekMarka">
          </div>
          <div>
            <label for="ekModel">Model</label>
            <input type="text" id="ekModel">
          </div>
        </div>
        <div class="form-satir-ikili">
          <div>
            <label for="ekSeriNo">Seri No</label>
            <input type="text" id="ekSeriNo">
          </div>
          <div>
            <label for="ekImalYili">İmal Yılı</label>
            <input type="number" id="ekImalYili" min="1950" max="2100">
          </div>
        </div>

        <div class="form-satir-ikili">
          <div>
            <label for="ekBolum">Bölüm</label>
            <input type="text" id="ekBolum">
            <div class="alan-hatasi" id="ekBolumHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
          <div>
            <label for="ekLokasyon">Lokasyon</label>
            <input type="text" id="ekLokasyon">
          </div>
        </div>
        <label for="ekSorumluPersonel">Sorumlu Personel</label>
        <input type="text" id="ekSorumluPersonel">

        <div class="form-satir-ikili">
          <div>
            <label for="ekPeriyotAy">Periyodik Kontrol Süresi (Ay)</label>
            <input type="number" id="ekPeriyotAy" min="1" max="120">
          </div>
          <div>
            <label for="ekDurum">Durum</label>
            <select id="ekDurum"></select>
          </div>
        </div>
        <div class="form-satir-ikili">
          <div>
            <label for="ekSonKontrolTarihi">Son Kontrol Tarihi</label>
            <input type="date" id="ekSonKontrolTarihi">
          </div>
          <div>
            <label for="ekSonrakiKontrolTarihi">Sonraki Kontrol Tarihi <span style="color:var(--metin-soluk); font-weight:400;">(otomatik)</span></label>
            <input type="date" id="ekSonrakiKontrolTarihi">
          </div>
        </div>

        <label for="ekNotlar">Notlar</label>
        <textarea id="ekNotlar"></textarea>

        <div class="modal-eylemler">
          <button type="button" class="ikincil" id="ekipmanModalIptalBtn">İptal</button>
          <button type="submit" class="birincil">Kaydet</button>
        </div>
      </form>
      <button type="button" class="tablo-buton" id="ekipmanModalKapatBtn" style="position:absolute; top:20px; right:24px;">✕</button>
    </div>
  </div>

  <!-- KONTROL MODAL -->
  <div class="modal-katman" id="kontrolModalKatman">
    <div class="modal-kutu" style="max-width:600px;">
      <h3 id="kontrolModalBaslik">Yeni Kontrol Kaydı</h3>
      <form id="kontrolForm">
        <label for="koEkipmanId">Ekipman</label>
        <select id="koEkipmanId"></select>
        <div class="alan-hatasi" id="koEkipmanIdHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <div class="form-satir-ikili">
          <div>
            <label for="koKontrolTarihi">Kontrol Tarihi</label>
            <input type="date" id="koKontrolTarihi">
            <div class="alan-hatasi" id="koKontrolTarihiHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
          <div>
            <label for="koKontrolTuru">Kontrol Türü</label>
            <select id="koKontrolTuru"></select>
          </div>
        </div>

        <div class="form-satir-ikili">
          <div>
            <label for="koRaporNo">Rapor No</label>
            <input type="text" id="koRaporNo">
          </div>
          <div>
            <label for="koSonuc">Sonuç</label>
            <select id="koSonuc"></select>
          </div>
        </div>

        <div class="form-satir-ikili">
          <div>
            <label for="koFirma">Kontrol Firması</label>
            <input type="text" id="koFirma">
            <div class="alan-hatasi" id="koFirmaHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
          <div>
            <label for="koUzman">Kontrol Uzmanı</label>
            <input type="text" id="koUzman">
          </div>
        </div>

        <label for="koAciklama">Açıklama</label>
        <textarea id="koAciklama"></textarea>

        <label for="koBelgeDosya">Rapor / Sertifika Görseli</label>
        <input type="file" id="koBelgeDosya" accept="image/*">
        <div id="koBelgeOnizleme" style="margin-top:6px; margin-bottom:10px;"></div>

        <div class="modal-eylemler">
          <button type="button" class="ikincil" id="kontrolModalIptalBtn">İptal</button>
          <button type="submit" class="birincil">Kaydet</button>
        </div>
      </form>
      <button type="button" class="tablo-buton" id="kontrolModalKapatBtn" style="position:absolute; top:20px; right:24px;">✕</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="../../core/data.js"></script>
  <script src="../../core/auth.js"></script>
  <script src="../../core/tenant.js"></script>
  <script src="../../core/excel.js"></script>
  <script src="../../core/rapor.js"></script>
  <script src="../../core/form-ayarlari.js"></script>
  <script src="model.js"></script>
  <script src="validation.js"></script>
  <script src="repository.js"></script>
  <script src="service.js"></script>
  <script src="ui.js"></script>
  <script src="cikti.js"></script>
  <script>
    const kullanici = girisGerekliModul('periyodik-kontrol');

    if (kullanici) {
      document.getElementById('kullaniciEtiketi').textContent = '👤 ' + kullanici.adSoyad;
      document.getElementById('cikisLinki').addEventListener('click', () => {
        cikisYap();
        window.location.href = '../../index.html';
      });

      const aktifFirma = aktifFirmaGetir();
      if (!aktifFirma) {
        window.location.href = '../../firma-sec.html';
      } else {
        bulutFirmaHazirOlduğunda(aktifFirma.slug, () => {
          document.getElementById('firmaEtiketi').textContent = aktifFirma.ad + ' periyodik kontrole tabi ekipman ve muayene kayıtları';
          periyodikSayfasiniBaslat();
        });
      }
    }
  </script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('../../sw.js'); }</script>
</body>
</html>
