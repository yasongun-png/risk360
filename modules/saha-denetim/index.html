<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İSG Platform - Saha Denetim</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <div class="ust-cubuk">
    <div class="marka">🛡️ İSG Yönetim Platformu</div>
    <div class="kullanici-bilgi">
      <span id="kullaniciEtiketi"></span>
      <a class="cikis-linki" id="cikisLinki">Çıkış Yap</a>
    </div>
  </div>

  <div class="icerik">
    <a href="../../dashboard.html" class="geri-link">← Kontrol Paneline Dön</a>
    <h2 style="margin-top:14px;">Saha Denetim</h2>
    <p style="color:#6b7280; font-size:13px; margin-top:-8px;" id="firmaEtiketi"></p>

    <div class="arac-cubugu">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <select id="denetimTuruFiltre" style="width:auto; margin:0;"></select>
        <select id="denetimDurumFiltre" style="width:auto; margin:0;">
          <option value="">Tüm Durumlar</option>
          <option value="false">Devam Ediyor</option>
          <option value="true">Tamamlandı</option>
        </select>
        <input type="text" id="denetimAramaKutusu" class="arama-kutusu" placeholder="Denetim no, bölüm veya denetçiye göre ara..." style="margin:0;">
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" class="ikincil" id="denetimDisaAktarBtn">Dışa Aktar</button>
        <button type="button" class="ikincil" id="denetimListeYazdirBtn">Listeyi Yazdır</button>
        <button type="button" class="birincil" id="yeniDenetimBtn" style="width:auto;">+ Yeni Denetim</button>
      </div>
    </div>

    <div class="tablo-scroll">
      <table class="veri-tablosu">
        <thead>
          <tr>
            <th>Denetim No</th>
            <th>Konu</th>
            <th>Tarih</th>
            <th>Bölüm</th>
            <th>Denetçi</th>
            <th>Puan</th>
            <th>Durum</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody id="denetimTabloGovde"></tbody>
      </table>
    </div>
    <div class="bos-durum" id="denetimBosDurum"></div>
  </div>

  <div id="yazdirmaAlani"></div>

  <!-- Yeni Denetim -->
  <div class="modal-katman" id="yeniDenetimModalKatman">
    <div class="modal-kutu">
      <h3>Yeni Saha Denetimi</h3>
      <p style="font-size:12px; color:var(--metin-soluk); margin-top:-8px;">
        Seçilen konunun standart kontrol listesi otomatik olarak yüklenir.
      </p>
      <form id="yeniDenetimForm">
        <label for="yeniDenetimTuru">Denetim Konusu</label>
        <select id="yeniDenetimTuru"></select>
        <div class="alan-hatasi" id="denetimTuruHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <div class="form-satir-ikili">
          <div>
            <label for="yeniDenetimTarih">Tarih</label>
            <input type="date" id="yeniDenetimTarih">
            <div class="alan-hatasi" id="tarihHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
          <div>
            <label for="yeniDenetimDenetci">Denetçi</label>
            <input type="text" id="yeniDenetimDenetci">
            <div class="alan-hatasi" id="denetciHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
        </div>

        <div class="form-satir-ikili">
          <div>
            <label for="yeniDenetimBolum">Bölüm</label>
            <input type="text" id="yeniDenetimBolum">
            <div class="alan-hatasi" id="bolumHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>
          </div>
          <div>
            <label for="yeniDenetimLokasyon">Lokasyon (opsiyonel)</label>
            <input type="text" id="yeniDenetimLokasyon">
          </div>
        </div>

        <div class="modal-eylemler">
          <button type="button" class="ikincil" id="yeniDenetimModalIptalBtn">İptal</button>
          <button type="submit" class="birincil">Denetimi Başlat</button>
        </div>
      </form>
      <button type="button" class="tablo-buton" id="yeniDenetimModalKapatBtn" style="position:absolute; top:20px; right:24px;">✕</button>
    </div>
  </div>

  <!-- Denetim Detayı: kontrol listesini doldurma -->
  <div class="modal-katman" id="denetimDetayModalKatman">
    <div class="modal-kutu" style="max-width:760px;">
      <h3 id="denetimDetayBaslik">Denetim</h3>
      <div id="denetimDetayMeta" style="font-size:13px; color:var(--metin-soluk); margin-bottom:10px;"></div>
      <div id="denetimDetayPuan" style="margin-bottom:14px;"></div>

      <div id="denetimDetayListe"></div>

      <label for="denetimDetayNotlar" style="margin-top:14px;">Genel Notlar</label>
      <textarea id="denetimDetayNotlar" rows="2"></textarea>

      <div class="modal-eylemler">
        <button type="button" class="ikincil" id="denetimDetayYazdirBtn">Yazdır</button>
        <button type="button" class="birincil" id="denetimDetayTamamlaBtn" style="width:auto;">Denetimi Tamamla</button>
      </div>
      <button type="button" class="tablo-buton" id="denetimDetayModalKapatBtn" style="position:absolute; top:20px; right:24px;">✕</button>
    </div>
  </div>

  <!-- Bulguyu Uygunsuzluğa Aktar -->
  <div class="modal-katman" id="aktarModalKatman">
    <div class="modal-kutu">
      <h3 id="aktarModalBaslik">Uygunsuzluğa Aktar</h3>
      <form id="aktarForm">
        <label for="aktarSorumlu">Sorumlu</label>
        <input type="text" id="aktarSorumlu">
        <div class="alan-hatasi" id="aktarSorumluHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <label for="aktarTermin">Termin</label>
        <input type="date" id="aktarTermin">
        <div class="alan-hatasi" id="aktarTerminHata" style="color:var(--hata); font-size:12px; margin-top:-12px; margin-bottom:10px;"></div>

        <label for="aktarRiskSeviyesi">Risk Seviyesi</label>
        <select id="aktarRiskSeviyesi"></select>

        <div class="modal-eylemler">
          <button type="button" class="ikincil" id="aktarModalIptalBtn">İptal</button>
          <button type="submit" class="birincil">Aktar</button>
        </div>
      </form>
      <button type="button" class="tablo-buton" id="aktarModalKapatBtn" style="position:absolute; top:20px; right:24px;">✕</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../core/data.js"></script>
  <script src="../../core/auth.js"></script>
  <script src="../../core/tenant.js"></script>
  <script src="../../core/excel.js"></script>
  <script src="../../core/rapor.js"></script>
  <script src="../uygunsuzluk/model.js"></script>
  <script src="../uygunsuzluk/validation.js"></script>
  <script src="../uygunsuzluk/repository.js"></script>
  <script src="../uygunsuzluk/service.js"></script>
  <script src="model.js"></script>
  <script src="validation.js"></script>
  <script src="repository.js"></script>
  <script src="service.js"></script>
  <script src="ui.js"></script>
  <script>
    const kullanici = girisGerekli();

    if (kullanici) {
      document.getElementById('kullaniciEtiketi').textContent = '👤 ' + kullanici.adSoyad;
      document.getElementById('cikisLinki').addEventListener('click', () => {
        cikisYap();
        window.location.href = '../../index.html';
      });

      const aktifFirma = aktifFirmaGetir();
      if (!aktifFirma) {
        window.location.href = '../../firma-sec.html';
      } else {
        bulutFirmaHazirOlduğunda(aktifFirma.slug, () => {
          document.getElementById('firmaEtiketi').textContent = aktifFirma.ad + ' firmasına ait saha denetimleri';
          sahaDenetimSayfasiniBaslat(aktifFirma);
        });
      }
    }
  </script>
</body>
</html>
