<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İSG Platform">
<link rel="icon" href="assets/icons/favicon-32.png">
<title>İSG Platform - Kontrol Paneli</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="ust-cubuk">
    <div class="marka">🛡️ İSG Yönetim Platformu</div>
    <div class="kullanici-bilgi">
      <span id="bildirimZili" style="display:none; position:relative; cursor:pointer; margin-right:6px;" title="Bildirimler">
        🔔<span id="bildirimSayaci" style="display:none; position:absolute; top:-6px; right:-9px; background:var(--hata,#dc2626); color:#fff; border-radius:9px; font-size:10px; font-weight:700; padding:1px 5px;"></span>
      </span>
      <span id="kullaniciEtiketi"></span>
      <a class="cikis-linki" id="sifremiDegistirLinki" style="margin-right:14px;">🔑 Şifremi Değiştir</a>
      <a class="cikis-linki" id="cikisLinki">Çıkış Yap</a>
    </div>
  </div>

  <div class="modal-katman" id="sdModalKatman">
    <div class="modal-kutu">
      <h3>Şifremi Değiştir</h3>

      <label for="sdMevcutSifre">Mevcut Şifre</label>
      <input type="password" id="sdMevcutSifre" autocomplete="current-password">

      <label for="sdYeniSifre">Yeni Şifre</label>
      <input type="password" id="sdYeniSifre" autocomplete="new-password">
      <p style="font-size:11px; color:var(--metin-soluk); margin-top:-6px;">En az 4 karakter.</p>

      <label for="sdYeniSifreTekrar">Yeni Şifre (Tekrar)</label>
      <input type="password" id="sdYeniSifreTekrar" autocomplete="new-password">

      <div class="alan-hatasi" id="sdModalHata"></div>

      <div class="modal-eylemler">
        <button type="button" class="ikincil" id="sdModalIptalBtn">İptal</button>
        <button type="button" class="birincil" id="sdModalKaydetBtn">Kaydet</button>
      </div>
    </div>
  </div>

  <div id="bildirimPaneli" style="display:none; position:fixed; top:54px; right:16px; width:320px; max-height:70vh; overflow-y:auto; background:var(--kart-bg,#fff); border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.18); padding:14px; z-index:1000;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong style="font-size:13px;">Yeni Kayıt Bildirimleri</strong>
      <button type="button" id="bildirimTemizleBtn" style="border:none; background:none; color:var(--celik-mavi,#1d4ed8); font-size:12px; font-weight:600; cursor:pointer;">Tümünü Okundu İşaretle</button>
    </div>
    <div id="bildirimListesi" style="display:flex; flex-direction:column; gap:8px;"></div>
    <div id="bildirimBos" style="font-size:12px; color:var(--metin-soluk,#6b7280);">Henüz bildirim yok.</div>
  </div>

  <div class="icerik">
    <div class="dashboard-ust">
      <div class="aktif-firma-rozeti" id="aktifFirmaRozeti"></div>
      <div class="baglanti-grubu" id="baglantiGrubu">
        <a href="firma-sec.html">Firma Değiştir</a>
      </div>
    </div>

    <div class="modul-grid" id="modulGrid"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="core/data.js"></script>
  <script src="core/auth.js"></script>
  <script src="core/tenant.js"></script>
  <script>
    function _dbKacir(v) {
      return String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    const kullanici = girisGerekli();

    const MODULLER = [
      { anahtar: 'personel', ikon: '👥', baslik: 'Personel Yönetimi', aciklama: 'Personel kayıtları ve TC Kimlik doğrulaması', baglanti: 'modules/personel/index.html', aktif: true },
      { anahtar: 'egitim', ikon: '🎓', baslik: 'Eğitim Yönetimi', aciklama: 'Zorunlu İSG eğitimleri ve sertifika takibi', baglanti: 'modules/egitim/index.html', aktif: true },
      { anahtar: 'yillik-plan', ikon: '📅', baslik: 'Yıllık Değerlendirme ve Planlama', aciklama: 'Eğitim planı, yıllık çalışma planı ve yıllık değerlendirme raporu', baglanti: 'modules/yillik-plan/index.html', aktif: true },
      { anahtar: 'risk', ikon: '⚠️', baslik: 'Risk Değerlendirmesi', aciklama: 'Tehlike tespiti ve risk skorlama', baglanti: 'modules/risk/index.html', aktif: true },
      { anahtar: 'kurul', ikon: '🏛️', baslik: 'İSG Kurulu', aciklama: 'Kurul toplantıları ve karar takibi', baglanti: 'modules/kurul/index.html', aktif: true },
      { anahtar: 'acil-durum', ikon: '🚨', baslik: 'Acil Durum Yönetimi', aciklama: 'Ekipler, ekipman, tatbikat ve acil durum planı', baglanti: 'modules/acil-durum/index.html', aktif: true },
      { anahtar: 'kimyasal', ikon: '🧪', baslik: 'Kimyasal Yönetimi', aciklama: 'Kimyasal envanteri, GBF/SDS takibi ve depolama uyumsuzluğu uyarıları', baglanti: 'modules/kimyasal/index.html', aktif: true },
      { anahtar: 'periyodik-kontrol', ikon: '🛠️', baslik: 'Periyodik Kontrol', aciklama: 'Basınçlı kap, kaldırma ekipmanı, elektrik tesisatı vb. yasal periyodik muayene takibi', baglanti: 'modules/periyodik-kontrol/index.html', aktif: true },
      { anahtar: 'kkd', ikon: '🦺', baslik: 'KKD Takibi', aciklama: 'KKD envanteri, zimmet takibi ve kullanım ihlali tutanakları', baglanti: 'modules/kkd/index.html', aktif: true },
      { anahtar: 'olay-kaza', ikon: '📋', baslik: 'Olay / Kaza Takibi', aciklama: 'İş kazası, ramak kala ve kök neden analizi', baglanti: 'modules/olay-kaza/index.html', aktif: true },
      { anahtar: 'uygunsuzluk', ikon: '✅', baslik: 'Uygunsuzluk', aciklama: 'Düzeltici, önleyici faaliyet ve onay akışı', baglanti: 'modules/uygunsuzluk/index.html', aktif: true },
      { anahtar: 'yuklenici', ikon: '🏗️', baslik: 'Yüklenici Yönetimi', aciklama: 'Yüklenici firma ve personel evrak uygunluğu', baglanti: 'modules/yuklenici/index.html', aktif: true },
      { anahtar: 'stajyer', ikon: '🧑‍🎓', baslik: 'Stajyer Yönetimi', aciklama: 'Stajyer kayıtları ve Temel Eğitim Belgesi', baglanti: 'modules/stajyer/index.html', aktif: true },
      { anahtar: 'sinav', ikon: '📝', baslik: 'Sınav Oluşturucu', aciklama: 'Soru bankası, rastgele sınav oluşturma ve sonuç takibi', baglanti: 'modules/sinav/index.html', aktif: true },
      { anahtar: 'saha-denetim', ikon: '🔍', baslik: 'Saha Denetim', aciklama: 'Konu bazlı kontrol listeleri, puanlama ve DÖF aktarımı', baglanti: 'modules/saha-denetim/index.html', aktif: true },
      { anahtar: 'malzeme-talep', ikon: '📦', baslik: 'İSG Malzeme Talep', aciklama: 'KKD/malzeme talep oluru, Word çıktısı ve olur takip listesi', baglanti: 'modules/malzeme-talep/index.html', aktif: true },
      { anahtar: 'is-izni', ikon: '🧾', baslik: 'İş İzinleri', aciklama: 'Sıcak çalışma, kapalı alan, yüksekte çalışma vb. çalışma izin belgeleri', baglanti: 'modules/is-izni/index.html', aktif: true },
      { anahtar: 'merkezi-aksiyon', ikon: '📌', baslik: 'Merkezi Aksiyon Takibi', aciklama: 'Tüm modüllerden doğan aksiyonların tekilleştirilmesi', baglanti: 'modules/merkezi-aksiyon/index.html', aktif: true },
      { anahtar: 'raporlar', ikon: '📊', baslik: 'Raporlar', aciklama: 'Tüm modüllerden derlenen İSG performans özeti, KPI kartları ve grafikler', baglanti: 'modules/raporlar/index.html', aktif: true },
      { anahtar: 'tespit-oneri', ikon: '📖', baslik: 'Tespit ve Öneri Defteri', aciklama: 'İSG uzmanı/işyeri hekimi tespit-öneri kayıtları, tebliğ ve kapanış takibi', baglanti: 'modules/tespit-oneri/index.html', aktif: true },
      { anahtar: 'hizmet-sozlesmesi', ikon: '🖋️', baslik: 'Hizmet Sözleşmeleri', aciklama: 'İSG Uzmanı, İşyeri Hekimi ve Diğer Sağlık Personeli hizmet sözleşmesi takibi', baglanti: 'modules/hizmet-sozlesmesi/index.html', aktif: true },
      { anahtar: 'harita', ikon: '🗺️', baslik: 'Saha Dijital Haritası', aciklama: 'Tesis krokisi üzerinde uygunsuzluk, arıza, risk, yangın/acil durum ekipmanı ve KKD noktası takibi', baglanti: 'modules/harita/index.html', aktif: true },
      { anahtar: 'bakim-talep', ikon: '🔧', baslik: 'Bakım ve İş İzni', aciklama: 'Birimlerden gelen bakım talebi; Bakım değerlendirmesi, İSG onayı ve gerekiyorsa İş İzni ile kapanışa kadar tek akış', baglanti: 'modules/bakim-talep/index.html', aktif: true }
    ];

    // Firestore'da modül verisi 'isg_<slug>_<tenantAnahtar-degeri>' biçiminde
    // saklanır ve tenantAnahtar()'a verilen değer MODULLER'deki 'anahtar'
    // (klasör adı) ile HER ZAMAN aynı DEĞİLDİR — çoğu modülün kendine özel,
    // hatta birden fazla alt anahtarı vardır (bkz. her modülün repository.js
    // dosyasındaki tenantAnahtar(...) çağrıları). Bildirime tıklandığında
    // doğru modüle yönlendirebilmek için bu eşleme tablosu gerekli.
    const _BILDIRIM_ANAHTAR_MODUL_ESLESME = {
      personel: 'personel',
      egitim_kayitlari: 'egitim',
      yillik_egitim_plani: 'yillik-plan', yillik_calisma_plani: 'yillik-plan', yillik_degerlendirme_raporu: 'yillik-plan',
      risk_kayitlari: 'risk', risk_bolumleri: 'risk',
      kurul_toplantilari: 'kurul', kurul_kararlari: 'kurul', kurul_olaylari: 'kurul', kurul_imzalari: 'kurul', kurul_ayici_faaliyetler: 'kurul', kurul_denetim: 'kurul',
      acil_durum_ekipleri: 'acil-durum', acil_durum_ekipmanlari: 'acil-durum', acil_durum_yangin_tupleri: 'acil-durum', acil_durum_tatbikatlari: 'acil-durum', acil_durum_senaryolari: 'acil-durum', acil_durum_plani: 'acil-durum',
      kimyasal_envanteri: 'kimyasal',
      periyodik_ekipmanlar: 'periyodik-kontrol', periyodik_kontroller: 'periyodik-kontrol',
      kkd_envanter: 'kkd', kkd_zimmetler: 'kkd', kkd_ihlaller: 'kkd',
      olay_kaza_kayitlari: 'olay-kaza', olay_kaza_ayarlari: 'olay-kaza',
      uygunsuzluk_kayitlari: 'uygunsuzluk', uygunsuzluk_konulari: 'uygunsuzluk',
      yuklenici_firmalari: 'yuklenici', yuklenici_kisileri: 'yuklenici', yuklenici_araclari: 'yuklenici', yuklenici_ziyaretciler: 'yuklenici',
      stajyer_kayitlari: 'stajyer',
      sinav_sorulari: 'sinav', sinav_sinavlar: 'sinav', sinav_sonuclari: 'sinav',
      saha_denetimleri: 'saha-denetim',
      malzeme_katalogu: 'malzeme-talep', malzeme_talepleri: 'malzeme-talep',
      is_izinleri: 'is-izni',
      tespit_oneri_kayitlari: 'tespit-oneri',
      hizmet_sozlesmeleri: 'hizmet-sozlesmesi',
      harita_tesisler: 'harita', harita_kayitlar: 'harita', harita_etiketler: 'harita', harita_oklar: 'harita',
      bakim_talepleri: 'bakim-talep', bakim_ekipman_envanteri: 'bakim-talep'
    };

    // Bir 'isg_<slug>_<tenantAnahtar>' anahtarını { firma, modul } olarak
    // çözer (modul, MODULLER içindeki eşleşen giriş — yoksa null).
    function _bildirimHedefiCoz(anahtar) {
      const govde = String(anahtar || '').replace(/^isg_/, '');
      const firmalar = getFirmalar();
      let eslesenFirma = null, altAnahtar = govde;
      firmalar.forEach(f => {
        const onEk = f.slug + '_';
        if (govde === f.slug || govde.startsWith(onEk)) {
          eslesenFirma = f;
          altAnahtar = govde === f.slug ? '' : govde.slice(onEk.length);
        }
      });
      const modulAdi = _BILDIRIM_ANAHTAR_MODUL_ESLESME[altAnahtar] || null;
      const modul = modulAdi ? MODULLER.find(m => m.anahtar === modulAdi) : null;
      return { firma: eslesenFirma, modul: modul || null };
    }

    // Bir 'isg_<slug>_<modulAdi>' anahtarından firma adı + modül başlığını
    // okunur hale getirir (bkz. core/data.js _yaziEkBildirimKontrolEt).
    function _bildirimEtiketiCoz(anahtar) {
      const { firma, modul } = _bildirimHedefiCoz(anahtar);
      const govde = String(anahtar || '').replace(/^isg_/, '');
      const altAnahtar = firma ? (govde === firma.slug ? '' : govde.slice(firma.slug.length + 1)) : govde;
      const modulEtiket = modul ? modul.baslik : altAnahtar;
      return (firma ? firma.ad + ' — ' : '') + modulEtiket;
    }

    // Bildirim herkese açık (hedefRol/hedefBirim boş) VEYA bu kullanıcının
    // rolüne/birimine hedefliyse görünür. Admin, gözetim amacıyla HER
    // bildirimi görür (kullanıcı isteği: "Yönetici/Admin: Tüm kayıtları
    // görür").
    function _bildirimKullaniciyaGorunurMu(b, kullanici) {
      if (!b.hedefRol && !b.hedefBirim) return true;
      if (kullaniciAdminMi(kullanici)) return true;
      if (b.hedefBirim) return kullanici.rol === 'birim' && kullanici.birimAdi === b.hedefBirim;
      if (b.hedefRol === 'bakim') return kullanici.rol === 'bakim';
      if (b.hedefRol === 'isg') return kullanici.rol === 'duzenleyici' && !!kullanici.isgOnayiVerebilir;
      return false;
    }

    function _bildirimOkunduMu(b, kullanici) {
      return Array.isArray(b.okuyanKullaniciIdleri) && b.okuyanKullaniciIdleri.includes(kullanici.id);
    }

    function _bildirimZiliniKur() {
      const zil = document.getElementById('bildirimZili');
      const panel = document.getElementById('bildirimPaneli');
      zil.style.display = 'inline-block';

      function gorunurBildirimleriGetir() {
        return oku('isg_bildirimler', []).filter(b => _bildirimKullaniciyaGorunurMu(b, kullanici));
      }

      function ciz() {
        const gorunurler = gorunurBildirimleriGetir();
        const okunmamis = gorunurler.filter(b => !_bildirimOkunduMu(b, kullanici));
        const sayac = document.getElementById('bildirimSayaci');
        sayac.style.display = okunmamis.length ? 'inline-block' : 'none';
        sayac.textContent = okunmamis.length > 99 ? '99+' : String(okunmamis.length);

        const liste = document.getElementById('bildirimListesi');
        const bos = document.getElementById('bildirimBos');
        // Okunmuş bildirimler artık listede de gösterilmez (kullanıcı isteği:
        // "okunduğunda artık sayıdan düşsün ve görünmesin") — sadece BU
        // kullanıcıya görünür VE okunmamış olanlar (en yeni üstte) listelenir.
        const siraliBildirimler = okunmamis.slice().reverse().slice(0, 50);
        bos.style.display = siraliBildirimler.length ? 'none' : 'block';
        liste.innerHTML = siraliBildirimler.map(b => {
          const etiketler = Array.isArray(b.kayitEtiketleri) ? b.kayitEtiketleri.filter(Boolean) : [];
          const eylemFiili = b.hedefRol || b.hedefBirim ? '' : 'yeni kayıt ekledi';
          const hedef = _bildirimHedefiCoz(b.anahtar);
          const tiklanabilirMi = !!(hedef.firma && hedef.modul);
          return `
          <div data-bildirim-id="${b.id}" style="border-left:3px solid var(--celik-mavi,#1d4ed8); padding:6px 10px; font-size:12px; ${tiklanabilirMi ? 'cursor:pointer;' : ''}" ${tiklanabilirMi ? 'title="İlgili modüle gitmek için tıklayın"' : ''}>
            <div><strong>${_dbKacir(b.adSoyad || b.kullaniciAdi)}</strong> ${eylemFiili}${etiketler.length ? (eylemFiili ? ': ' : '') + '<strong>' + _dbKacir(etiketler.join(', ')) + '</strong>' : ''}</div>
            <div style="color:var(--metin-soluk,#6b7280);">${_dbKacir(_bildirimEtiketiCoz(b.anahtar))}</div>
            <div style="color:var(--metin-soluk,#6b7280);">${new Date(b.tarih).toLocaleString('tr-TR')}</div>
          </div>
        `;
        }).join('');

        // Bildirime tıklandığında ilgili firma/modüle yönlendirir (kullanıcı
        // isteği: "tıkladığımda ilgili yere yönlendirmeli"). Önce o TEK
        // bildirim BU kullanıcı için okundu işaretlenir (kişi bazlı takip —
        // bkz. okuyanKullaniciIdleri), sonra gerekiyorsa aktif firma
        // değiştirilip modül sayfasına gidilir.
        liste.querySelectorAll('[data-bildirim-id]').forEach(satir => {
          satir.addEventListener('click', () => {
            const id = satir.getAttribute('data-bildirim-id');
            const guncel = oku('isg_bildirimler', []);
            const kayit = guncel.find(x => x.id === id);
            if (!kayit) return;
            const hedef = _bildirimHedefiCoz(kayit.anahtar);
            yaz('isg_bildirimler', guncel.map(x => {
              if (x.id !== id) return x;
              const okuyanlar = Array.isArray(x.okuyanKullaniciIdleri) ? x.okuyanKullaniciIdleri.slice() : [];
              if (!okuyanlar.includes(kullanici.id)) okuyanlar.push(kullanici.id);
              return Object.assign({}, x, { okuyanKullaniciIdleri: okuyanlar });
            }));
            if (hedef.firma && hedef.modul) {
              if (!aktifFirmaGetir() || aktifFirmaGetir().id !== hedef.firma.id) aktifFirmaAyarla(hedef.firma.id);
              window.location.href = hedef.modul.baglanti;
            } else {
              ciz();
            }
          });
        });
      }

      zil.addEventListener('click', () => {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        if (panel.style.display === 'block') ciz();
      });

      document.getElementById('bildirimTemizleBtn').addEventListener('click', () => {
        // Sadece BU kullanıcıya görünür olanları kendi adına okundu işaretler
        // — başka bir kullanıcıya hedefli bildirimlere dokunmaz.
        const tumBildirimler = oku('isg_bildirimler', []);
        tumBildirimler.forEach(b => {
          if (!_bildirimKullaniciyaGorunurMu(b, kullanici)) return;
          b.okuyanKullaniciIdleri = Array.isArray(b.okuyanKullaniciIdleri) ? b.okuyanKullaniciIdleri : [];
          if (!b.okuyanKullaniciIdleri.includes(kullanici.id)) b.okuyanKullaniciIdleri.push(kullanici.id);
        });
        yaz('isg_bildirimler', tumBildirimler);
        ciz();
      });

      document.addEventListener('click', (e) => {
        if (!panel.contains(e.target) && !zil.contains(e.target)) panel.style.display = 'none';
      });

      ciz();
    }

    function sdModalAc() {
      document.getElementById('sdMevcutSifre').value = '';
      document.getElementById('sdYeniSifre').value = '';
      document.getElementById('sdYeniSifreTekrar').value = '';
      document.getElementById('sdModalHata').textContent = '';
      document.getElementById('sdModalKatman').classList.add('acik');
    }

    function sdModalKapat() {
      document.getElementById('sdModalKatman').classList.remove('acik');
    }

    async function sdKaydet() {
      const mevcutSifre = document.getElementById('sdMevcutSifre').value;
      const yeniSifre = document.getElementById('sdYeniSifre').value;
      const yeniSifreTekrar = document.getElementById('sdYeniSifreTekrar').value;
      const hataEl = document.getElementById('sdModalHata');

      if (yeniSifre !== yeniSifreTekrar) {
        hataEl.textContent = 'Yeni şifreler birbiriyle eşleşmiyor.';
        return;
      }

      const sonuc = await kendiSifresiniDegistir(mevcutSifre, yeniSifre);
      if (!sonuc.basarili) {
        hataEl.textContent = sonuc.hata;
        return;
      }

      sdModalKapat();
      alert('Şifreniz güncellendi.');
    }

    if (kullanici) {
      document.getElementById('kullaniciEtiketi').textContent = '👤 ' + kullanici.adSoyad;

      document.getElementById('sifremiDegistirLinki').addEventListener('click', sdModalAc);
      document.getElementById('sdModalIptalBtn').addEventListener('click', sdModalKapat);
      document.getElementById('sdModalKaydetBtn').addEventListener('click', sdKaydet);

      document.getElementById('cikisLinki').addEventListener('click', () => {
        cikisYap();
        window.location.href = 'index.html';
      });

      if (kullaniciAdminMi(kullanici)) {
        document.getElementById('baglantiGrubu').insertAdjacentHTML('beforeend', `
          <a href="firma-yonetim.html">Firma Yönetimi</a>
          <a href="kullanicilar.html">👥 Kullanıcılar</a>
          <a href="giris-kayitlari.html">🕒 Giriş Kayıtları</a>
          <a href="ayarlar.html">⚙️ Ayarlar</a>
        `);
      }

      // Yeni bir cihaz/tarayıcıda bulut henüz ilk senkronunu yapmadan
      // aktifFirmaGetir() çağrılırsa firma verisi buluttan gelmemiş
      // görünüp "firma yok" sanılıp firma-sec.html'e geri atılabiliyordu —
      // bkz. bulutHazirOlduğunda (core/data.js). Bulut kapalıysa bu
      // callback zaten anında çalışır.
      bulutHazirOlduğunda(() => {
      // Zil artık HERKESTE görünür (kullanıcı isteği: "kullanıcı şifresi
      // olan herkeste zil bildirim kısmı olsun") — admin/düzenleyici yeni
      // kayıt eklediğinde tüm kullanıcılara görünür (bkz. core/data.js
      // _yaziEkBildirimKontrolEt).
      _bildirimZiliniKur();
      const aktifFirma = aktifFirmaGetir();
      if (!aktifFirma) {
        window.location.href = 'firma-sec.html';
      } else {
        const rozet = document.getElementById('aktifFirmaRozeti');
        rozet.innerHTML = `<span class="nokta" style="background:${aktifFirma.renk}"></span> ${_dbKacir(aktifFirma.ad)}`;

        const grid = document.getElementById('modulGrid');
        // Kullanıcı isteği: "modülleri isimlerine göre sırala" — dashboard
        // kartları artık başlığa göre alfabetik (tr-TR) sıralanır.
        const siraliModuller = MODULLER.slice().sort((a, b) => a.baslik.localeCompare(b.baslik, 'tr'));
        siraliModuller.forEach(modul => {
          // Artık TÜM roller (admin/düzenleyici/İK) her modüle girip
          // görüntüleyebilir — asıl kısıtlama modül İÇİNDE uygulanır: İK
          // sadece Personel/Eğitim'de yeni kayıt ekleyebilir, diğerlerinde
          // sadece görüntüler (kullaniciEklemeYapabilirMi); hiçbir kısıtlı
          // rol hiçbir yerde silemez (kullaniciSilebilirMi). Kullanıcı
          // isteği: "diğer modülleri sadece görsün ekleme yapamasın".
          const erisilebilir = modul.aktif && kullaniciModuleErisebilirMi(kullanici);
          const sadeceGoruntuleme = erisilebilir && !kullaniciEklemeYapabilirMi(kullanici, modul.anahtar);
          const kart = document.createElement(erisilebilir ? 'a' : 'div');
          kart.className = 'modul-kart ' + (erisilebilir ? 'aktif' : 'pasif');
          if (erisilebilir) kart.href = modul.baglanti;
          const etiket = !modul.aktif ? '<span class="yakinda-etiket">YAKINDA</span>'
            : (!erisilebilir ? '<span class="yakinda-etiket">YETKİNİZ YOK</span>'
            : (sadeceGoruntuleme ? '<span class="yakinda-etiket">SADECE GÖRÜNTÜLEME</span>' : ''));
          kart.innerHTML = `
            <div class="ikon">${modul.ikon}</div>
            <div class="baslik">${modul.baslik}</div>
            <div class="aciklama">${modul.aciklama}</div>
            ${etiket}
          `;
          grid.appendChild(kart);
        });
      }
      });
    }
  </script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }</script>
</body>
